# 每天自動更新職缺資料
# 台灣時間每天早上 9:00（= UTC 01:00）執行，也可以在 Actions 頁面按「Run workflow」手動執行。
name: 每日更新職缺

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # 需要寫入權限，才能把更新後的 JSON 存回 repo

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行爬蟲（規則篩選，不用 AI）
        # 注意：GitHub 的主機在美國／歐洲，部分台灣網站可能限制國外 IP。
        # 某個來源失敗不會中斷其他來源；全部失敗時保留上次資料、不會清空。
        run: python -m scraper.run

      - name: （選用）AI 篩選新職缺
        # 沒有設定 AI_API_KEY 這個 secret 時會自動跳過
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python -m scraper.ai_filter
        continue-on-error: true

      - name: 存回更新後的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/meta.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "自動更新職缺 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
