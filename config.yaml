# ============================================================
#  Anya 的職缺追蹤 — 設定檔（改這個檔就能調整搜尋條件）
#  修改規則：
#   - 每行開頭的空白要對齊（用空格，不要用 Tab）
#   - 「#」後面是註解，程式會忽略
#   - 關鍵字要加引號也可以，例如 "UI設計 實習"
# ============================================================

# 職缺保留幾天（超過就從清單移除；有加星號的職缺在網頁上仍會保留在你的收藏）
keep_days: 45

# 禮貌爬取設定
http:
  delay_seconds: 1.2        # 每個請求之間等待秒數（不要調太低）
  timeout_seconds: 20
  user_agent: "Mozilla/5.0 (compatible; JerryJobTracker/1.0; personal use)"

# ------------------------------------------------------------
# 地區：職缺地點必須包含下列任一詞（或被標為遠端）才會保留
# ------------------------------------------------------------
locations:
  include: ["台北", "臺北", "新北", "雙北", "北北基", "Taipei", "New Taipei",
            "遠端", "線上", "在家", "Remote", "remote", "視訊",
            "板橋", "中和", "永和", "新店", "三重", "新莊", "土城", "汐止", "淡水", "林口", "蘆洲", "樹林",
            "內湖", "南港", "士林", "北投", "萬華", "文山", "古亭", "公館"]
  # 註：「中正、中山、信義、大安、大同」等區名其他縣市也有，「北市」會誤中「竹北市」，所以沒放進來

# ------------------------------------------------------------
# 排除：標題或公司出現這些詞就丟掉（服務業、業務、高階職等）
# ------------------------------------------------------------
exclude:
  service_keywords: ["門市", "店員", "餐飲", "餐廳", "服務生", "外場", "內場", "廚", "吧台", "咖啡師", "烘焙",
                     "收銀", "外送", "房務", "飯店", "旅宿", "清潔", "打掃", "搬運", "包裝", "倉儲", "理貨",
                     "保全", "電話行銷", "電銷", "直銷", "保險業務", "業務專員", "業務代表", "銷售專員",
                     "美容", "美髮", "按摩", "照服", "看護", "司機", "物流", "加油", "醫美",
                     "壽司", "飲料", "手搖", "拉麵", "火鍋", "早餐", "超商", "便利商店", "賣場", "全聯", "家樂福",
                     "麥當勞", "肯德基", "星巴克", "分店", "店長"]
  seniority_keywords: ["資深", "主管", "經理", "總監", "Senior", "Sr.", "Lead", "Manager", "Director", "Principal", "Head of"]
  other_keywords: ["工程師", "Engineer", "Engineering", "Software", "業務", "Sales", "Mid-level", "Staff ",
                   "市調", "座談會", "試用品", "代購", "徵老師", "[自介]", "[仲介]", "[公告]", "[討論]", "[交換]"]
  max_experience_years: 1   # 104 經歷要求超過幾年就排除（0 = 只要經歷不拘）

# ------------------------------------------------------------
# 類別：每個類別有自己的「標題必須包含的詞」；
# 抓到的職缺標題若符合多個類別，以下面順序第一個符合的為準。
# ------------------------------------------------------------
categories:
  - name: "家教伴讀"
    title_keywords: ["家教", "伴讀", "課輔", "課後輔導", "陪讀", "個別指導", "家庭教師", "Tutor", "tutor", "講師"]
  - name: "設計與生涯"
    title_keywords: ["UI", "UX", "使用者體驗", "使用者介面", "體驗設計", "產品設計", "Product Design", "產品企劃",
                     "介面設計", "互動設計", "服務設計", "使用者研究", "User Research", "生涯", "職涯", "Career"]
  - name: "藝術與諮詢"
    title_keywords: ["視覺", "平面設計", "美編", "美術", "插畫", "繪", "動畫", "設計助理", "設計師", "Designer",
                     "Illustrat", "Graphic", "Visual", "諮商", "諮詢", "心理", "顧問助理", "藝術", "策展"]
  - name: "一般工讀"
    title_keywords: ["工讀", "助理", "兼職", "實習", "行政", "文書", "資料整理", "Intern", "intern", "Assistant", "Part-time", "Part Time"]

# 入門職判斷：來源設定 entry_level_only: true 時，標題要含下列任一詞才保留
entry_keywords: ["實習", "Intern", "intern", "工讀", "助理", "Assistant", "初級", "Junior", "junior", "新鮮人", "應屆",
                 "兼職", "接案", "Part-time", "Part Time", "PT", "家教", "伴讀", "Entry", "entry"]

# 判斷是否為實習／遠端的詞
intern_keywords: ["實習", "Intern", "intern", "Internship"]
remote_keywords: ["遠端", "Remote", "remote", "在家工作", "WFH", "線上家教", "線上"]

# ------------------------------------------------------------
# 各來源設定。enabled: false 可以關掉某個來源
# ------------------------------------------------------------
sources:
  "104":
    enabled: true
    pages: 1                      # 每個關鍵字抓幾頁（每頁 30 筆）
    area: "6001001000,6001002000" # 台北市, 新北市
    fetch_details: true           # 對「新」職缺抓詳細頁取得工作天數／遠端資訊
    max_details_per_run: 80
    # 格式：關鍵字 | 額外參數（&jobexp=1 = 經歷不拘/1年以下；&ro=2 = 兼職）
    keywords:
      - "UI設計 實習"
      - "UX 實習"
      - "UI/UX|&jobexp=1"
      - "使用者體驗|&jobexp=1"
      - "產品設計 助理"
      - "產品設計|&jobexp=1"
      - "產品企劃 實習"
      - "UI設計|&jobexp=1"
      - "視覺設計 工讀"
      - "視覺設計 實習"
      - "平面設計 實習"
      - "插畫 工讀"
      - "插畫|&jobexp=1"
      - "美術助理"
      - "美編 工讀"
      - "設計助理|&jobexp=1"
      - "生涯 助理"
      - "生涯發展"
      - "職涯 顧問|&jobexp=1"
      - "諮商 助理"
      - "心理 助理|&jobexp=1"
      - "顧問助理|&jobexp=1"
      - "行政工讀"
      - "研究助理 工讀"
      - "研究助理|&ro=2"
      - "資料整理 工讀"
      - "伴讀"
      - "家教"
      - "課輔 工讀"
      - "線上家教"
    remote_keywords:              # 這些關鍵字另外搜「全台遠端」(不限地區，只留遠端職缺)
      - "UI/UX"
      - "插畫"
      - "線上家教"

  "518":
    enabled: true
    pages: 1
    keywords: ["UI設計", "UX", "視覺設計 實習", "平面設計 工讀", "插畫", "美術助理", "美編 工讀",
               "顧問助理", "行政工讀", "研究助理", "家教", "伴讀", "課輔", "諮商"]

  ptt:
    enabled: true
    index_pages: 3                # 每個看板往回翻幾頁
    boards: ["HomeTeach", "part-time"]
    hometeach_tags: ["[家教]", "[上台]"]
    parttime_region_prefix: ["[台北", "[新北", "[北北基", "[雙北", "[遠端", "[線上", "[全台", "[不限"]
    fetch_body: true              # 抓文章內文找時薪、天數

  yourator:
    enabled: true
    entry_level_only: true        # Yourator 沒有經歷欄位，只留標題看得出是實習／入門的職缺
    pages: 2
    keywords: ["UI", "UX", "產品設計", "視覺設計", "插畫", "美術", "設計實習", "設計助理", "研究助理", "家教", "職涯", "諮商"]

  linkedin:
    enabled: true
    pages: 2                      # 每頁 25 筆
    location: "Taipei City, Taiwan"
    keywords: ["UX Designer", "UI Designer", "Product Designer", "UI UX Intern", "Graphic Designer",
               "Visual Designer", "Illustrator", "Design Intern", "Research Assistant", "Tutor",
               "Career Consultant", "設計實習生", "UI設計"]

  tutor1111:
    enabled: true
    pages: 2
    # sDuty0 = 科目代碼（100600 = 伴讀；留空 = 所有科目）；sCity0 = 100100 台北市, 100200 新北市
    searches:
      - {label: "伴讀", query: "sCity0=100100,100200&sDuty0=100600"}
      - {label: "全部科目", query: "sCity0=100100,100200"}

# ------------------------------------------------------------
# （選用）AI 篩選：只處理「本次新抓到」的職缺。
# 金鑰與服務商用環境變數設定（AI_API_KEY、AI_BASE_URL、AI_MODEL），不要寫在這裡。
# ------------------------------------------------------------
ai:
  batch_size: 15            # 一次送幾筆給 AI（越大越省提示詞，但太大容易出錯）
  desc_chars: 160           # 每筆職缺描述最多送幾個字
  max_jobs_per_run: 150     # 每次最多處理幾筆（保護費用）
  drop_low_fit: false       # true = AI 判定「低」的職缺直接從清單移除；false = 只標註
  profile: >-
    求職者 Anya，住雙北，可接受遠端。想找：UX/UI、產品設計、體驗設計、生涯發展相關的入門或實習職；
    視覺藝術、插畫、平面設計、諮詢／諮商助理；非服務業的一般工讀（行政、研究助理、資料整理）；家教或伴讀。
    不要：服務業（餐飲、門市、清潔、搬運）、業務／電銷、需多年經驗的資深職、工程師職。
